name: CI & RPM Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Go Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Verify Binary Compilation
        run: make all

  build-rpm:
    name: Build RPM & Publish Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install RPM Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Determine Release Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building RPM package version: ${VERSION}"

      - name: Prepare RPM Build Environment
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p $HOME/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive --prefix=redborder-hub-satellite-${VERSION}/ -o $HOME/rpmbuild/SOURCES/redborder-hub-satellite-${VERSION}.tar.gz HEAD

      - name: Build Redborder Hub RPM
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          rpmbuild --nodeps \
                   --define "__version ${VERSION}" \
                   --define "__release 1" \
                   --define "_topdir $HOME/rpmbuild" \
                   -ba packaging/rpm/redborder-hub.spec

      - name: Build Redborder Satellite RPM
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          rpmbuild --nodeps \
                   --define "__version ${VERSION}" \
                   --define "__release 1" \
                   --define "_topdir $HOME/rpmbuild" \
                   -ba packaging/rpm/redborder-satellite.spec

      - name: Organize RPM Packages
        run: |
          mkdir -p artifacts
          cp $HOME/rpmbuild/RPMS/*/*.rpm artifacts/
          cp $HOME/rpmbuild/SRPMS/*.src.rpm artifacts/

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redborder-rpm-packages-${{ steps.get_version.outputs.VERSION }}
          path: artifacts/*

      - name: Create GitHub Release (On Version Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
