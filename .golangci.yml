run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-use-default: true
  exclude-rules:
    - linters:
        - errcheck
      text: "Error return value of `.*(Close|Fprintf|Fprintln|Print|Println|Remove|RemoveAll|SetReadDeadline|SetWriteDeadline|WriteMessage)` is not checked"
